<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admissions | Sample School</title>
    <meta name="description" content="Sample School">
    <link rel="icon" href="assets/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="site-header"></div>
    <main>
        <section>
            <div class="wrap">
                <h1 style="margin:0">Admissions</h1>
                <p class=muted>Joining us is simple.</p>
            </div>
        </section>
        <section class="tint">
            <div class="wrap">
                <h2>Admission forms</h2>
                <div data-render="admissionFiles"></div>
            </div>
        </section>
        <section>
            <div class="wrap split">
                <div data-render="steps"></div>
                <div class="side">
                    <h3>Admission enquiry</h3>
                    <form data-form="admission" data-ok="Thank you! We will contact you soon."><label for="a1">Student /
                            guardian name</label><input id="a1" name="name" required maxlength="80"><label
                            for="a2">Phone</label><input id="a2" name="phone" type="tel" required maxlength="20"><label
                            for="a3">Email (optional)</label><input id="a3" name="email" type="email"
                            maxlength="100"><label for="a4">Class</label><select id="a4" name="class" required
                            data-render="classes"></select><label for="a5">Message (optional)</label><textarea id="a5"
                            name="message" rows="3" maxlength="1000"></textarea><input class="hp" name="website"
                            tabindex="-1" autocomplete="off" aria-hidden="true">
                        <p><button class="btn" type="submit">Send enquiry</button></p>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/school.js"></script>
</body>

</html>
