<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact | Sample School</title>
    <meta name="description" content="Sample School">
    <link rel="icon" href="assets/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="site-header"></div>
    <main>
        <section>
            <div class="wrap">
                <h1 style="margin:0">Contact Us</h1>
            </div>
        </section>
        <section>
            <div class="wrap split">
                <div>
                    <h2>Send a message</h2>
                    <form data-form="contact" data-ok="Thank you! Your message has been received."><label for="c1">Your
                            name</label><input id="c1" name="name" required maxlength="80"><label
                            for="c2">Email</label><input id="c2" name="email" type="email" required
                            maxlength="100"><label for="c3">Phone (optional)</label><input id="c3" name="phone"
                            type="tel" maxlength="20"><label for="c4">Message</label><textarea id="c4" name="message"
                            rows="5" required minlength="10" maxlength="1000"></textarea><input class="hp"
                            name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
                        <p><button class="btn" type="submit">Send message</button></p>
                    </form>
                </div>
                <div>
                    <div class="side" data-render="info"></div><iframe title="Map"
                        style="width:100%;height:280px;border:0;margin-top:18px" loading="lazy"
                        src="https://www.google.com/maps?q=Kathmandu&output=embed"></iframe>
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/school.js"></script>
</body>

</html>
